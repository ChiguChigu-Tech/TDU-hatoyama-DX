<!DOCTYPE html>
<html lang="ja" dir="ltr">
<head>
<meta charset="utf-8">
<title>管理者ログイン画面（モックアップ）</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<h1>管理者ログイン画面</h1>

<div class="reg">
    <table class="reg_form">
    <tr>
    <td><label for="userid">ユーザーID:</label></td>
    <td><input type="text" id="userid" disabled></td>
    </tr>
    <tr>
    <td><label for="password">パスワード:</label></td>
    <td><input type="password" id="password" disabled></td>
    </tr>
    </table>

    <button type="button" class="btn" disabled>Login</button>
</div>

<div class="explain">
    <h2>この画面について</h2>
    <p>この画面は、管理者機能のUIを検討するために作成したモックアップです。</p>
    <p>実際のユーザー認証、パスワード照合、データベース連携、権限管理、セッション管理は実装されていません。</p>
    <p>本プロジェクトは現在、開発・保守を終了しています。</p>
    <p><a href="index.html">トップページへ戻る</a></p>
</div>

</body>
</html>
